<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喵喵大戰：罐罐保衛戰 🐱</title>
    <link rel="icon" href="data:,">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;700&display=swap');

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #b8f2e6;
            background-image: 
                radial-gradient(#a3e4d7 15%, transparent 16%), 
                radial-gradient(#a3e4d7 15%, transparent 16%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            font-family: 'Fredoka One', 'Noto Sans TC', cursive, sans-serif; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas { display: block; background-color: transparent; }
        
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; 
        }
        .top-ui { display: flex; justify-content: space-between; padding: 15px; } 
        .top-left { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .top-right { text-align: right; pointer-events: auto; }

        #home-btn {
            background: #fff; color: #ff8b94; width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 0 #ffaaa5;
            transition: transform 0.1s; border: 3px solid #ff8b94;
        }
        #home-btn:active { transform: translateY(4px); box-shadow: none; }

        #minimap-container {
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.9);
            border: 5px solid #ff8b94;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #minimap-canvas { width: 100%; height: 100%; display: block; }

        .hud-text { 
            color: #ff6f69; text-shadow: 2px 2px 0 #fff; 
            font-weight: bold; font-size: 18px; margin-bottom: 5px; 
            background: rgba(255,255,255,0.9); padding: 8px 15px;
            border-radius: 25px; display: inline-block;
            border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #leaderboard {
            background: rgba(255, 255, 255, 0.9); 
            padding: 10px; border-radius: 18px; color: #555; 
            font-size: 0.9rem; min-width: 160px;
            border: 3px solid #ffd3b6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }
        .leader-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 2px;}
        .leader-row:last-child { border-bottom: none; }
        
        #weapon-bar {
            pointer-events: auto; display: flex; gap: 15px; justify-content: center; margin-bottom: 30px;
        }
        .weapon-slot {
            width: 70px; height: 70px; background: #fff;
            border: 5px solid #ffd3b6; border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; cursor: pointer; transition: all 0.2s;
            position: relative; box-shadow: 0 6px 0 #e0e0e0;
        }
        .weapon-slot.active {
            border-color: #ff8b94; background: #fff0f0;
            transform: translateY(-6px); box-shadow: 0 12px 0 #ffaaa5;
        }
        .key-hint {
            position: absolute; top: -12px; right: -12px; 
            width: 24px; height: 24px; background: #555; color: white;
            border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff;
        }

        .fullscreen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 253, 231, 0.98);
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; z-index: 20; color: #555;
            pointer-events: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px 12px 30px 12px;
            box-sizing: border-box;
        }
        
        .title-img {
            max-width: 80%;
            height: auto;
            margin-bottom: 8px;
            max-height: clamp(80px, 18vh, 150px); 
            object-fit: contain;
            filter: drop-shadow(0px 4px 0px rgba(0,0,0,0.1));
        }

        .btn {
            background: #ff8b94; color: white; border: none; padding: 12px 42px;
            font-size: 1.35rem; cursor: pointer; border-radius: 50px;
            box-shadow: 0 6px 0 #ff6f69; font-weight: bold; font-family: inherit;
            margin-top: 8px; margin-bottom: 20px; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
            transition: transform 0.1s, background-color 0.1s;
        }
        .btn:hover { transform: scale(1.05); background: #ff6f69; }
        .btn:active { transform: translateY(6px); box-shadow: none; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .btn-ai {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            border: 2px solid #fff; color: #fff; font-size: 0.9rem;
            padding: 8px 14px; border-radius: 15px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(161, 140, 209, 0.4); margin-left: 10px;
            transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn-ai:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(161, 140, 209, 0.6); }
        .btn-ai:active { transform: translateY(2px); }

        .input-wrapper { display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        input { 
            padding: 10px 15px; font-size: 1.2rem; border-radius: 20px; 
            border: 3px solid #ffaaa5; text-align: center; width: 190px; 
            font-family: 'Noto Sans TC', sans-serif; outline: none; background: #fff;
        }
        input:focus { border-color: #ff6f69; }

        .skin-selector { display: flex; gap: 14px; margin-bottom: 12px; }
        .skin-option {
            width: 54px; height: 54px; border-radius: 50%; border: 3px solid #eee;
            cursor: pointer; position: relative; overflow: hidden;
            background-color: #fff; box-shadow: 0 3px 0 #ddd;
            transition: transform 0.2s; display: flex; align-items: center; justify-content: center;
            font-size: 26px;
        }
        .skin-option:hover { transform: scale(1.1); }
        .skin-option.selected { border-color: #ff8b94; box-shadow: 0 0 0 4px #ffecf0; transform: scale(1.1); }
        .skin-white { background: #fff; }
        .skin-orange { background: #ffe0b2; }
        .skin-black { background: #424242; color: white !important; }
        .skin-calico { background: linear-gradient(135deg, #fff 40%, #ffcc80 40%, #ffcc80 60%, #424242 60%); }

        #ai-report-box {
            background: white; border: 3px solid #a18cd1; border-radius: 15px;
            padding: 15px; width: 80%; max-width: 400px;
            min-height: 80px; margin: 15px 0;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 1rem; color: #555;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: none;
        }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ' .'; } 40% { content: ' ..'; } 60% { content: ' ...'; } 100% { content: ''; }}

        #mobile-controls { display: none; pointer-events: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5; }
        .joystick-zone { position: absolute; bottom: 80px; width: 140px; height: 140px; pointer-events: auto; }
        #stick-left { left: 30px; background: rgba(255,255,255,0.3); border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); }
        #stick-right { right: 30px; background: rgba(255,255,255,0.3); border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); }
        .stick-knob { 
            width: 50px; height: 50px; background: #fff; 
            border-radius: 50%; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        #game-over-screen { display: none; z-index: 30; }

        @media (max-width: 768px) {
            #mobile-controls { display: block; }
            .btn { font-size: 1.3rem; padding: 15px 40px; }
            #weapon-bar { margin-bottom: 20px; gap: 10px; }
            .weapon-slot { width: 60px; height: 60px; font-size: 28px; }
            .skin-option { width: 60px; height: 60px; font-size: 32px; }
            input { width: 160px; font-size: 1.1rem; }
            .title-img { max-width: 85%; max-height: 150px; }
            #leaderboard { min-width: 110px; padding: 6px; font-size: 0.75rem; border-width: 2px; background: rgba(255, 255, 255, 0.7); }
            .leader-row { margin-bottom: 2px; }
            .top-ui { padding: 8px; }
            #home-btn { width: 32px; height: 32px; font-size: 16px; border-width: 2px; }
            #minimap-container { width: 90px; height: 90px; border-width: 2px; }
            .hud-text { font-size: 12px; padding: 4px 8px; }
            #music-btn { width: 30px; height: 30px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <audio id="bgm" loop volume="0.3">
        <source src="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/theme_01.mp3" type="audio/mpeg">
    </audio>

    <div id="ui-layer">
        <div class="top-ui">
            <div class="top-left">
                <div id="home-btn" onclick="goHome()" title="回首頁">🏠</div>
                <div id="minimap-container">
                    <canvas id="minimap-canvas"></canvas>
                </div>
                <div class="hud-text" style="color: #ff8b94;">
                    罐罐保衛戰 <span id="hp-display">🐟🐟🐟🐟🐟</span>
                </div>
            </div>

            <div class="top-right">
                <div id="leaderboard">
                    <div style="border-bottom:2px dashed #ffd3b6; margin-bottom:5px; padding-bottom:5px; text-align:center; color:#ff6f69;">
                        🏆 排行榜
                    </div>
                    <div id="leader-list" style="text-align: center; color: #aaa; font-size: 12px;">等待連線中...</div>
                </div>
                <div style="margin-top: 10px; text-align: right;">
                    <button id="music-btn" onclick="toggleMusic()" style="background:white; border:2px solid #ff8b94; border-radius:50%; width:40px; height:40px; cursor:pointer; font-size:20px;">🔇</button>
                </div>
            </div>
        </div>

        <div id="weapon-bar">
            <div class="weapon-slot active" id="weapon-btn-0" onclick="selectWeaponUI(0)">
                <span class="key-hint">1</span>🦴
            </div>
            <div class="weapon-slot" id="weapon-btn-1" onclick="selectWeaponUI(1)">
                <span class="key-hint">2</span>💣
            </div>
            <div class="weapon-slot" id="weapon-btn-2" onclick="selectWeaponUI(2)">
                <span class="key-hint">3</span>🧶
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="fullscreen-overlay">
        <img src="image_dc3274.png" alt="喵喵大戰" class="title-img" onerror="this.style.display='none'; document.getElementById('backup-title').style.display='block';">
        <h1 id="backup-title" style="display:none; color: #ff8b94;">喵喵大戰</h1>
        
        <p style="margin-bottom: 20px; font-size: 1.3rem; color:#888;">選擇你的喵喵，保護罐罐！</p>
        
        <div class="input-wrapper">
            <input type="text" id="username-input" placeholder="輸入喵喵的名字" maxlength="8">
            <button class="btn-ai" onclick="generateAIName()" title="Gemini 幫我取名">
                ✨ 幫我取名
            </button>
        </div>
        
        <div style="margin-bottom: 15px; color: #ff8b94; font-weight: bold; font-size: 1.1rem;">選擇你的喵喵</div>
        <div class="skin-selector">
            <div class="skin-option skin-white selected" onclick="selectSkin('white', this)" title="白白">🐱</div>
            <div class="skin-option skin-orange" onclick="selectSkin('orange', this)" title="橘子">🐱</div>
            <div class="skin-option skin-black" onclick="selectSkin('black', this)" title="黑炭">🐱</div>
            <div class="skin-option skin-calico" onclick="selectSkin('calico', this)" title="三花">🐱</div>
        </div>

        <div style="margin-top:20px; margin-bottom: 25px; font-size: 0.95rem; color: #aaa; max-width: 400px; text-align: center; line-height: 1.6;">
            電腦: WASD 移動, 滑鼠瞄準射擊<br>
            手機: 左搖桿移動, 右搖桿射擊<br>
        </div>

        <button id="start-btn" class="btn" onclick="startGame()">開始喵喵叫</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="fullscreen-overlay">
        <img src="image_dc323d.png" alt="沒收罐罐！" class="title-img" onerror="this.style.display='none'; document.getElementById('backup-end').style.display='block';">
        <h1 id="backup-end" style="display:none; color: #ff6f69;">沒收罐罐！</h1>
        
        <p style="font-size: 1.5rem; color:#ff6f69; margin-bottom: 15px;">你的零食被搶光了...</p>
        <div style="font-size: 2.5rem; color:#555; background: #fff; padding: 15px 40px; border-radius: 20px; border: 4px solid #ff8b94; box-shadow: 0 8px 15px rgba(0,0,0,0.1);">
            得分: <span id="final-score" style="color: #ff6f69; font-weight: bold;">0</span>
        </div>
        
        <div id="ai-report-box">
            <span id="ai-report-text"></span>
        </div>
        <button class="btn-ai" id="btn-report" onclick="generateAIReport()" style="margin-top: 15px; font-size: 1.1rem; padding: 12px 30px;">
            ✨ 生成 AI 戰報
        </button>

        <button class="btn" onclick="location.reload()">再試一次</button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="stick-left" class="joystick-zone"><div class="stick-knob"></div></div>
        <div id="stick-right" class="joystick-zone"><div class="stick-knob" style="background: #ffecf0;"></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBJeNW2rgKcxFrv5BAafIf6blKdbfNTDx4",
            authDomain: "meow-meow-battle-final.firebaseapp.com",
            projectId: "meow-meow-battle-final",
            storageBucket: "meow-meow-battle-final.firebasestorage.app",
            messagingSenderId: "833986217202",
            appId: "1:833986217202:web:ac4ec7c80a8080b34afc6b"
        };

        let app, auth, db, user;
        const appId = "meow-battle"; 
        let isOffline = false; 

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase init error:", e);
            isOffline = true;
        }

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.3;

        function playSound(type) {
            if (!soundEnabled || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'damage') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        window.toggleMusic = function() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            soundEnabled = !soundEnabled;
            const musicBtn = document.getElementById('music-btn');
            if (bgm.paused) {
                bgm.play().catch(e => console.error("BGM error:", e));
                musicBtn.innerText = "🔊";
            } else {
                bgm.pause();
                musicBtn.innerText = "🔇";
            }
        };

        window.generateAIName = async function() {
            const input = document.getElementById('username-input');
            const btn = document.querySelector('.btn-ai');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✨...'; btn.disabled = true;
            input.placeholder = "思考中...";
            try {
                const text = await callGemini("請給我一個繁體中文的貓咪戰士名字，要好笑、可愛又霸氣，最多5個字。只要給名字就好，不要其他文字。");
                input.value = text.trim();
            } catch (e) { 
                console.error("Generate name fallback:", e); 
                const fallbackNames = ["罐罐毀滅者", "肉球無影手", "傲嬌黑糖糕", "狂暴橘胖胖", "秋刀魚獵手", "毛線球狂徒", "九命貓仙人", "飛天小魚乾"];
                input.value = fallbackNames[Math.floor(Math.random() * fallbackNames.length)]; 
            } finally { 
                btn.innerHTML = originalText; btn.disabled = false; 
            }
        };

        window.generateAIReport = async function() {
            const box = document.getElementById('ai-report-box');
            const textSpan = document.getElementById('ai-report-text');
            const btn = document.getElementById('btn-report');
            box.style.display = 'flex'; btn.style.display = 'none'; 
            textSpan.innerHTML = '<span class="loading-dots">撰寫戰報中</span>';
            const prompt = `貓咪戰士「${myName}」獲得了 ${myState.score} 分後陣亡。請寫一段簡短（30字內）幽默嘲諷的墓誌銘。`;
            try {
                const text = await callGemini(prompt);
                textSpan.innerText = text.trim();
            } catch (e) { 
                const fallbackReports = [
                    "罐罐雖逝，喵魂永存！下次請少貪吃一罐。",
                    "為了最後一條小魚乾英勇捐軀，重於泰山！",
                    "死因：對毛線球毫無抵抗力，不幸被包圍。",
                    "安息吧，偉大的罐罐守護者，貓砂盆永遠為你敞開。"
                ];
                textSpan.innerText = fallbackReports[Math.floor(Math.random() * fallbackReports.length)]; 
            }
        };

        async function callGemini(userPrompt) {
            // 嘗試透過後端安全代理呼叫 Gemini（金鑰受後端環境變數保護）
            try {
                const proxyRes = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userPrompt })
                });
                if (proxyRes.ok) {
                    const data = await proxyRes.json();
                    if (data.text) return data.text.trim();
                }
            } catch (e) {
                // 後端代理未啟動或連線失敗
            }

            // 安全備用方案（離線或純靜態託管時無金鑰亦可正常運作）
            if (userPrompt.includes("名字")) {
                const names = ["罐罐毀滅者", "肉球無影手", "傲嬌黑糖糕", "狂暴橘胖胖", "秋刀魚獵手", "毛線球狂徒", "九命貓仙人", "飛天小魚乾"];
                return names[Math.floor(Math.random() * names.length)];
            }
            const fallbackReports = [
                "罐罐雖逝，喵魂永存！下次請少貪吃一罐。",
                "為了最後一條小魚乾英勇捐軀，重於泰山！",
                "死因：對毛線球毫無抵抗力，不幸被包圍。",
                "安息吧，偉大的罐罐守護者，貓砂盆永遠為你敞開。"
            ];
            return fallbackReports[Math.floor(Math.random() * fallbackReports.length)];
        }

        // --- GAME STATE & VARIABLES ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapCtx = minimapCanvas ? minimapCanvas.getContext('2d') : null;
        
        let gameActive = false;
        let myId = null;
        let myName = "無名喵";
        let mySkin = "white"; 
        let inputMode = 'mouse';
        const WORLD_SIZE = 3000; 

        const players = {};
        let enemies = []; 
        let projectiles = [];
        let particles = [];
        let leaderList = []; 
        
        const myState = { x: 0, y: 0, hp: 100, score: 0, angle: 0, weapon: 0, lastShot: 0, moveX: 0, moveY: 0 };

        const weapons = [
            { name: "魚刺", speed: 10, damage: 35, cooldown: 500, icon: "🦴", color: "#FFEB3B", type: "boomerang", size: 20 },
            { name: "炸彈", speed: 12, damage: 50, cooldown: 800, icon: "💣", color: "#333", type: "bomb", size: 15 },
            { name: "毛線", speed: 15, damage: 20, cooldown: 150, icon: "🧶", color: "#ff8b94", type: "rapid", size: 10 }
        ];

        const enemyConfig = [
            { icon: "🐕", speed: 2.2, hp: 80, color: "#D2B48C" }, 
            { icon: "🦥", speed: 0.6, hp: 150, color: "#C0C0C0" },
            { icon: "🐇", speed: 2.5, hp: 50, color: "#FFDAB9" },
            { icon: "🦊", speed: 2.0, hp: 70, color: "#FF8C00" },
            { icon: "🦜", speed: 2.8, hp: 40, color: "#FF6347" },
            { icon: "🐼", speed: 1.0, hp: 120, color: "#F0F8FF" }
        ];
        
        const camera = { x: 0, y: 0 };
        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        function resizeCanvas() {
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight;
            if (minimapCanvas) { 
                minimapCanvas.width = 130; 
                minimapCanvas.height = 130; 
            }
        }
        resizeCanvas();

        window.selectWeaponUI = function(index) {
            myState.weapon = index;
            document.querySelectorAll('.weapon-slot').forEach((el, i) => {
                if (i === index) el.classList.add('active'); else el.classList.remove('active');
            });
        };

        window.selectSkin = function(skin, el) {
            mySkin = skin;
            document.querySelectorAll('.skin-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        };

        window.goHome = function() { 
            if (window.confirm("確定要回家嗎？")) location.reload(); 
        };

        // --- NETWORKING WITH FALLBACK ---
        async function initNetwork() {
            return new Promise((resolve) => {
                const timeout = setTimeout(() => {
                    console.warn("Firebase Auth timeout -> Offline Mode active");
                    isOffline = true;
                    resolve();
                }, 2500);

                if (!auth) {
                    clearTimeout(timeout);
                    isOffline = true;
                    resolve();
                    return;
                }

                onAuthStateChanged(auth, (u) => {
                    clearTimeout(timeout);
                    if (u) { 
                        user = u; 
                        resolve(); 
                    } else { 
                        signInAnonymously(auth).catch(error => {
                            console.warn("Anonymous Sign-in failed -> Offline fallback", error);
                            isOffline = true;
                            resolve(); 
                        });
                    }
                });
            });
        }

        function startSync() {
            if (isOffline || !db) return; 
            try {
                const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');
                onSnapshot(playersRef, (snapshot) => {
                    const now = Date.now();
                    snapshot.docChanges().forEach((change) => {
                        const pid = change.doc.id;
                        const data = change.doc.data();
                        if (change.type === "removed") {
                            delete players[pid];
                        } else if (pid !== myId) {
                            players[pid] = data;
                        }
                    });
                    refreshLeaderboardData();
                }, (err) => {
                    console.warn("Sync stream error, falling back to local leaderboard:", err);
                });
            } catch (e) {
                console.warn("Firestore sync init failed", e);
            }
        }

        function refreshLeaderboardData() {
             let allPlayers = Object.values(players);
             if (myId) {
                 allPlayers.push({ name: myName, score: myState.score });
             }
             allPlayers.sort((a,b) => b.score - a.score);
             leaderList = allPlayers.slice(0, 5);
             
             const div = document.getElementById('leader-list');
             if (!div) return;
             
             if (allPlayers.length === 0) {
                 div.innerHTML = `<div style="text-align:center; color:#aaa; font-size:12px;">單機離線遊玩中</div>`;
             } else {
                 div.innerHTML = leaderList.map((p, i) => 
                    `<div class="leader-row">
                        <span>${i===0?'👑 ':''}#${i+1} ${p.name ? p.name.substring(0,6) : '無名'}</span>
                        <span style="color:#ff8b94">${p.score}</span>
                    </div>`
                 ).join('');
             }
        }

        setInterval(() => {
            if (!gameActive || !myId || isOffline || !db) return;
            try {
                const myRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', myId);
                setDoc(myRef, {
                    x: Math.round(myState.x),
                    y: Math.round(myState.y),
                    angle: parseFloat(myState.angle.toFixed(2)),
                    weapon: myState.weapon,
                    hp: myState.hp,
                    score: myState.score,
                    name: myName,
                    skin: mySkin,
                    lastActive: serverTimestamp() 
                }, { merge: true }).catch(() => {});
            } catch (e) {}
        }, 200);

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 700 + Math.random() * 200; 
            const type = enemyConfig[Math.floor(Math.random() * enemyConfig.length)];
            enemies.push({
                x: myState.x + Math.cos(angle) * dist,
                y: myState.y + Math.sin(angle) * dist,
                hp: type.hp, maxHp: type.hp,
                speed: type.speed, icon: type.icon, color: type.color,
                wobble: Math.random() * Math.PI * 2
            });
        }

        function showGameOver() {
            document.getElementById('final-score').innerText = myState.score;
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'none'; 
            document.getElementById('ai-report-box').style.display = 'none';
            document.getElementById('btn-report').style.display = 'flex';
            
            bgm.pause();
            bgm.currentTime = 0;
            document.getElementById('music-btn').innerText = "🔇";
        }

        function updateHp() {
            let fish = "";
            const count = Math.max(0, Math.ceil(myState.hp / 20)); 
            for(let i=0; i<count; i++) fish += "🐟";
            document.getElementById('hp-display').innerText = fish;
        }

        function drawPlayer(ctx, x, y, angle, isMe, name, weaponIdx, skin = 'white') {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "#555"; ctx.font = "bold 14px 'Noto Sans TC'"; 
            ctx.textAlign = "center"; ctx.fillText(name, 0, -45);
            ctx.rotate(angle);
            
            let bodyColor = "#ffffff", strokeColor = "#333", earColor = "#fff";
            if (skin === 'orange') { bodyColor = "#ffe0b2"; earColor = "#ffcc80"; }
            if (skin === 'black') { bodyColor = "#424242"; strokeColor = "#000"; earColor = "#424242"; }
            if (skin === 'calico') { bodyColor = "#fff"; }

            ctx.save(); ctx.translate(22, 10); ctx.rotate(Math.PI / 4);
            ctx.font = "28px Arial"; ctx.fillText(weapons[weaponIdx || 0].icon, 0, 0); ctx.restore();

            ctx.beginPath(); ctx.ellipse(-10, 0, 15, 10, 0, 0, Math.PI*2);
            ctx.fillStyle = bodyColor; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=strokeColor; ctx.stroke();

            ctx.beginPath(); ctx.ellipse(0, 0, 28, 22, 0, 0, Math.PI * 2); 
            ctx.fillStyle = bodyColor; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = strokeColor; ctx.stroke();

            ctx.fillStyle = earColor;
            ctx.beginPath(); ctx.moveTo(-20, -15); ctx.lineTo(-28, -28); ctx.lineTo(-10, -20); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(20, -15); ctx.lineTo(28, -28); ctx.lineTo(10, -20); ctx.fill(); ctx.stroke();

            ctx.beginPath(); ctx.ellipse(0, 0, 28, 22, 0, 0, Math.PI * 2); 
            ctx.fillStyle = bodyColor; ctx.fill(); ctx.stroke();

            ctx.fillStyle = (skin === 'black') ? "#fff" : "#000";
            ctx.beginPath(); ctx.arc(-12, 2, 3, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(12, 2, 3, 0, Math.PI*2); ctx.fill(); 

            ctx.fillStyle = "#FFEB3B";
            ctx.beginPath(); ctx.ellipse(0, 6, 4, 3, 0, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#333"; ctx.lineWidth=1; ctx.stroke();

            ctx.strokeStyle = (skin === 'black') ? "#ccc" : "#333"; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-32, 2); ctx.lineTo(-22, 4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-32, 8); ctx.lineTo(-22, 8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-32, 14); ctx.lineTo(-22, 12); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(32, 2); ctx.lineTo(22, 4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(32, 8); ctx.lineTo(22, 8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(32, 14); ctx.lineTo(22, 12); ctx.stroke();

            if (skin === 'calico') {
                ctx.fillStyle = "#ffcc80"; ctx.beginPath(); ctx.arc(-18, -10, 6, 0, Math.PI*2); ctx.fill(); 
                ctx.fillStyle = "#424242"; ctx.beginPath(); ctx.arc(18, -8, 5, 0, Math.PI*2); ctx.fill(); 
            }
            ctx.restore();
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            const mapW = minimapCanvas.width; 
            const mapH = minimapCanvas.height;
            const scale = mapW / WORLD_SIZE;
            minimapCtx.fillStyle = '#f9f9f9'; 
            minimapCtx.fillRect(0, 0, mapW, mapH);
            const cx = mapW / 2; const cy = mapH / 2;
            function worldToMap(x, y) { return { x: cx + x * scale, y: cy + y * scale }; }

            minimapCtx.fillStyle = '#ff8b94';
            for(let e of enemies) {
                const pos = worldToMap(e.x, e.y);
                minimapCtx.beginPath(); minimapCtx.arc(pos.x, pos.y, 3, 0, Math.PI*2); minimapCtx.fill();
            }
            minimapCtx.fillStyle = '#a8e6cf';
            const now = Date.now();
            for (let id in players) {
                const p = players[id];
                if (p.lastActive && typeof p.lastActive.toMillis === 'function' && now - p.lastActive.toMillis() > 60000) continue;
                const pos = worldToMap(p.x, p.y);
                minimapCtx.beginPath(); minimapCtx.arc(pos.x, pos.y, 4, 0, Math.PI * 2); minimapCtx.fill();
            }
            if (gameActive) {
                const myPos = worldToMap(myState.x, myState.y);
                minimapCtx.fillStyle = '#555'; minimapCtx.beginPath(); minimapCtx.arc(myPos.x, myPos.y, 5, 0, Math.PI*2); minimapCtx.fill();
            }
        }

        function draw() {
            ctx.fillStyle = '#b8f2e6'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save(); 
            ctx.translate(-camera.x, -camera.y);
            
            // 繪製外圍邊界紅色警示線
            ctx.strokeStyle = "#ff8b94";
            ctx.lineWidth = 6;
            ctx.strokeRect(-WORLD_SIZE/2, -WORLD_SIZE/2, WORLD_SIZE, WORLD_SIZE);
            
            // 繪製背景網格
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            const gridSize = 100;
            const offsetX = Math.floor(camera.x / gridSize) * gridSize;
            const offsetY = Math.floor(camera.y / gridSize) * gridSize;
            for(let x = offsetX - gridSize; x < offsetX + canvas.width + gridSize; x += gridSize) {
                for(let y = offsetY - gridSize; y < offsetY + canvas.height + gridSize; y += gridSize) {
                     if ((x/gridSize + y/gridSize) % 2 === 0) ctx.fillRect(x, y, gridSize, gridSize);
                }
            }

            // 繪製敵人：完全不透明且無背景圓圈
            for (let e of enemies) {
                ctx.save(); 
                ctx.translate(e.x, e.y); 
                ctx.rotate(Math.sin(e.wobble) * 0.1); 
                
                // 強制重設 Alpha 與 FillStyle，絕不繼承透明度
                ctx.globalAlpha = 1.0; 
                ctx.fillStyle = "#000000"; 

                ctx.font = "60px Arial"; 
                ctx.textAlign = "center"; 
                ctx.textBaseline = "middle";

                // 移除陰影
                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;

                ctx.fillText(e.icon, 0, 5); 
                
                if (e.hp < e.maxHp) {
                    ctx.fillStyle = "#fff"; ctx.fillRect(-20, -45, 40, 6);
                    ctx.strokeStyle = "#555"; ctx.lineWidth=1; ctx.strokeRect(-20, -45, 40, 6);
                    ctx.fillStyle = "#ff6f69"; ctx.fillRect(-19, -44, 38 * (e.hp/e.maxHp), 4);
                }
                ctx.restore();
            }

            const now = Date.now();
            ctx.globalAlpha = 1.0; // 重設全域 Alpha
            for (let id in players) {
                const p = players[id];
                if (p.lastActive && typeof p.lastActive.toMillis === 'function' && now - p.lastActive.toMillis() > 60000) continue;
                drawPlayer(ctx, p.x, p.y, p.angle, false, p.name || '喵戰士', p.weapon, p.skin);
            }
            if (gameActive) {
                drawPlayer(ctx, myState.x, myState.y, myState.angle, true, myName, myState.weapon, mySkin);
            }

            for (let p of projectiles) {
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
                const w = weapons[p.weaponIdx];
                if (w.type === 'boomerang') {
                    ctx.fillStyle = "#FFEB3B"; ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(15, -15); ctx.quadraticCurveTo(0, 0, 15, 15); ctx.quadraticCurveTo(-20, 0, 15, -15); ctx.fill(); ctx.stroke();
                } else {
                    ctx.font = "30px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(w.icon, 0, 0);
                }
                ctx.restore();
            }

            for(let p of particles) {
                if(p.text) {
                    ctx.font = "bold 24px 'Fredoka One'"; ctx.fillStyle = "white"; ctx.strokeStyle="black"; ctx.lineWidth=3;
                    ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y);
                } else { 
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI*2); ctx.fill(); 
                }
            }
            ctx.restore();
            drawMinimap();
        }

        function update() {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy = -1;
            if (keys['s'] || keys['arrowdown']) dy = 1;
            if (keys['a'] || keys['arrowleft']) dx = -1;
            if (keys['d'] || keys['arrowright']) dx = 1;
            if (myState.moveX !== 0 || myState.moveY !== 0) { dx = myState.moveX; dy = myState.moveY; }
            if (dx !== 0 || dy !== 0) {
                if (inputMode === 'mouse' || (myState.moveX === 0 && myState.moveY === 0)) {
                    const len = Math.sqrt(dx*dx + dy*dy); dx /= len; dy /= len;
                }
                myState.x += dx * 5; myState.y += dy * 5;
            }
            
            // 邊界防護
            if (myState.x < -WORLD_SIZE/2) myState.x = -WORLD_SIZE/2;
            if (myState.x > WORLD_SIZE/2) myState.x = WORLD_SIZE/2;
            if (myState.y < -WORLD_SIZE/2) myState.y = -WORLD_SIZE/2;
            if (myState.y > WORLD_SIZE/2) myState.y = WORLD_SIZE/2;

            if (inputMode === 'mouse') {
                const screenX = myState.x - camera.x;
                const screenY = myState.y - camera.y;
                myState.angle = Math.atan2(mouse.y - screenY, mouse.x - screenX);
            }

            const now = Date.now();
            const w = weapons[myState.weapon];
            if (mouse.down && now - myState.lastShot > w.cooldown) {
                myState.lastShot = now;
                playSound('shoot');
                myState.x -= Math.cos(myState.angle) * 3; 
                myState.y -= Math.sin(myState.angle) * 3;
                projectiles.push({
                    x: myState.x, y: myState.y, 
                    vx: Math.cos(myState.angle) * w.speed, 
                    vy: Math.sin(myState.angle) * w.speed,
                    weaponIdx: myState.weapon, life: 90, rotation: 0
                });
            }

            let scoreChanged = false;
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                p.rotation += (weapons[p.weaponIdx].type === 'boomerang') ? 0.4 : 0.1;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(p.x - e.x, p.y - e.y) < 50) { 
                        playSound('hit');
                        for(let k=0; k<4; k++) particles.push({x: e.x, y: e.y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 15, color: '#ffecf0', size: Math.random()*5+2});
                        e.hp -= weapons[p.weaponIdx].damage;
                        if (e.hp <= 0) {
                            enemies.splice(j, 1); 
                            myState.score += 15; 
                            scoreChanged = true;
                            for(let k=0; k<8; k++) particles.push({x: e.x, y: e.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 30, color: '#fff', size: Math.random()*8+4});
                        }
                        projectiles.splice(i, 1); 
                        break;
                    }
                }
                if (p.life <= 0) projectiles.splice(i, 1);
            }
            if (scoreChanged) refreshLeaderboardData();

            if (enemies.length < 15 && Math.random() < 0.04) spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const angle = Math.atan2(myState.y - e.y, myState.x - e.x);
                e.wobble += 0.1; 
                e.x += Math.cos(angle) * e.speed; 
                e.y += Math.sin(angle) * e.speed;
                if (Math.hypot(myState.x - e.x, myState.y - e.y) < 40) {
                    playSound('damage'); 
                    myState.hp -= 1; 
                    updateHp();
                    e.x -= Math.cos(angle) * 30; 
                    e.y -= Math.sin(angle) * 30;
                    particles.push({x: myState.x, y:myState.y, vx:0, vy:-2, life: 30, text:"😿", color:"red"});
                }
            }
            camera.x = myState.x - canvas.width / 2; 
            camera.y = myState.y - canvas.height / 2;
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if(p.life <= 0) particles.splice(i, 1);
            }
            if (myState.hp <= 0 && gameActive) { 
                gameActive = false; 
                showGameOver(); 
            }
        }

        window.gameLoop = function() {
            if (!gameActive) return;
            try {
                update();
                draw();
                requestAnimationFrame(window.gameLoop);
            } catch (err) {
                console.error("Game Loop Exception:", err);
                gameActive = false;
            }
        };

        window.startGame = async function() {
            const btn = document.getElementById('start-btn');
            btn.innerText = "連線中...";
            btn.disabled = true;

            const nameInput = document.getElementById('username-input');
            if (!nameInput.value.trim()) {
                nameInput.style.borderColor = "red"; 
                btn.innerText = "開始喵喵叫";
                btn.disabled = false;
                return;
            }
            myName = nameInput.value.trim();
            nameInput.blur();
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
            bgm.play().catch(e => console.warn("BGM autoplay restriction", e));

            try {
                await initNetwork();
                
                if (!isOffline && db) {
                    try {
                        myId = doc(collection(db, 'artifacts', appId, 'public', 'data', 'players')).id;
                    } catch(e) {
                         myId = "offline_" + Date.now();
                         isOffline = true;
                    }
                } else {
                    myId = "offline_" + Date.now();
                }

                myState.x = Math.random() * 1000 - 500;
                myState.y = Math.random() * 1000 - 500;
                myState.hp = 100; 
                myState.score = 0;
                
                resizeCanvas();
                
                if (!isOffline) startSync();
                
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('ui-layer').style.pointerEvents = 'auto'; 
                
                gameActive = true;
                
                // 強制第一幀渲染
                draw();
                requestAnimationFrame(window.gameLoop);
                console.log("Game successfully initiated! isOffline =", isOffline);

            } catch (err) {
                console.error("Critical startGame error:", err);
                btn.innerText = "開始喵喵叫";
                btn.disabled = false;
            }
        };

        window.addEventListener('keydown', e => {
            if (!gameActive) return; 
            keys[e.key.toLowerCase()] = true;
            if(e.key === '1') selectWeaponUI(0);
            if(e.key === '2') selectWeaponUI(1);
            if(e.key === '3') selectWeaponUI(2);
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (gameActive) inputMode = 'mouse'; });
        window.addEventListener('mousedown', () => { mouse.down = true; if (gameActive) inputMode = 'mouse'; });
        window.addEventListener('mouseup', () => mouse.down = false);
        window.addEventListener('resize', resizeCanvas);

        // 搖桿手機控制邏輯
        const stickLeft = document.getElementById('stick-left');
        const stickRight = document.getElementById('stick-right');

        function handleTouch(stick, isMove) {
            stick.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.targetTouches[0];
                updateStick(touch, stick, isMove);
            }, { passive: false });

            stick.addEventListener('touchmove', e => {
                e.preventDefault();
                const touch = e.targetTouches[0];
                updateStick(touch, stick, isMove);
            }, { passive: false });

            stick.addEventListener('touchend', e => {
                e.preventDefault();
                stick.children[0].style.transform = `translate(-50%, -50%)`;
                if(isMove) { 
                    myState.moveX = 0; 
                    myState.moveY = 0; 
                } else { 
                    mouse.down = false; 
                }
            });
        }

        function updateStick(touch, stick, isMove) {
            const rect = stick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 50;

            if(dist > maxDist) {
                dx = (dx/dist) * maxDist;
                dy = (dy/dist) * maxDist;
            }

            stick.children[0].style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            if (isMove) {
                myState.moveX = dx / maxDist;
                myState.moveY = dy / maxDist;
                inputMode = 'touch';
            } else {
                inputMode = 'touch';
                myState.angle = Math.atan2(dy, dx);
                mouse.down = true;
            }
        }

        handleTouch(stickLeft, true);
        handleTouch(stickRight, false);

        console.log("Game client script loaded and ready.");
    </script>
</body>
